{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-user-plus"></i> Add New Teacher</h1>
    <div>
        <a href="{{ url_for('dept_admin.manage_teachers') }}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back to Teachers
        </a>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>First Name *</label>
                    <input type="text" name="first_name" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Last Name *</label>
                    <input type="text" name="last_name" class="form-control" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Username *</label>
                    <input type="text" name="username" class="form-control" required>
                    <small>Must be unique</small>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Email *</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Password *</label>
                    <input type="password" name="password" class="form-control" required>
                    <small>Minimum 6 characters</small>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Title</label>
                    <select name="title" class="form-control">
                        <option value="Instructor">Instructor</option>
                        <option value="Assistant Professor">Assistant Professor</option>
                        <option value="Associate Professor">Associate Professor</option>
                        <option value="Professor">Professor</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Date of Birth</label>
                    <input type="date" name="teacher_dob" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Major/Specialization</label>
                    <select name="teacher_major_id" class="form-control">
                        <option value="">-- Select Major --</option>
                        {% for major in majors %}
                        <option value="{{ major.major_id }}">{{ major.major_name }} ({{ major.major_code }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Office Location</label>
                    <input type="text" name="office_location" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Office Phone</label>
                    <input type="text" name="office_phone" class="form-control">
                </div>
            </div>
            <div class="mb-3">
                <label>Research Area</label>
                <input type="text" name="research_area" class="form-control" placeholder="e.g., Machine Learning, Quantum Computing">
            </div>
            <div class="mb-3">
                <label>Certifications</label>
                <textarea name="certifications" class="form-control" rows="2" placeholder="List certifications, one per line"></textarea>
            </div>
            <div class="mb-3">
                <label>Education</label>
                <textarea name="education" class="form-control" rows="3" placeholder="PhD in Computer Science, MIT (2015)&#10;MS in CS, Stanford (2010)"></textarea>
            </div>
            <div class="alert alert-info">
                <strong>Department:</strong> {{ department.department_name }}<br>
                <strong>Employee Number:</strong> Auto-generated (EMP2026XXXX)
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary btn-lg px-5">
                    <i class="fas fa-save"></i> Create Teacher
                </button>
                <a href="{{ url_for('dept_admin.manage_teachers') }}" class="btn btn-secondary btn-lg px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
