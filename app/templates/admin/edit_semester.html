{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-edit"></i> Edit Semester</h1>
    <a href="{{ url_for('admin.manage_semesters') }}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Back to Semesters
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Semester Code *</label>
                    <input type="text" name="semester_code" class="form-control" value="{{ semester.semester_code }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Semester Name *</label>
                    <input type="text" name="semester_name" class="form-control" value="{{ semester.semester_name }}" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Year *</label>
                    <input type="number" name="year" class="form-control" value="{{ semester.year }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <div class="form-check mt-4">
                        <input type="checkbox" name="is_active" class="form-check-input" value="1" {% if semester.is_active %}checked{% endif %}>
                        <label class="form-check-label">Active Semester</label>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Start Date *</label>
                    <input type="date" name="start_date" class="form-control" value="{{ semester.start_date }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>End Date *</label>
                    <input type="date" name="end_date" class="form-control" value="{{ semester.end_date }}" required>
                </div>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-primary">Update Semester</button>
                <a href="{{ url_for('admin.manage_semesters') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
