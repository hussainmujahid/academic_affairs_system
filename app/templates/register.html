{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-user-plus"></i> Register New Account</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">First Name <span class="text-danger">*</span></label>
                            <input type="text" name="first_name" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Name <span class="text-danger">*</span></label>
                            <input type="text" name="last_name" class="form-control" required>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Username <span class="text-danger">*</span></label>
                            <input type="text" name="username" class="form-control" required>
                            <small class="text-muted">Choose a unique username</small>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Password <span class="text-danger">*</span></label>
                        <input type="password" name="password" class="form-control" required>
                        <small class="text-muted">Minimum 6 characters</small>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Role <span class="text-danger">*</span></label>
                        <select name="role" id="role" class="form-control" required>
                            <option value="">Select Role</option>
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                        </select>
                    </div>
                    
                    <!-- Student Fields -->
                    <div id="student-fields" style="display: none;">
                        <div class="card mb-3">
                            <div class="card-header bg-light">
                                <h6 class="mb-0">Student Information</h6>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">Student Number</label>
                                    <input type="text" name="student_number" class="form-control" placeholder="Will be auto-generated if left blank">
                                    <small class="text-muted">Leave blank to auto-generate (e.g., STU2024001)</small>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Major</label>
                                    <select name="major_id" class="form-control">
                                        <option value="">Select Major</option>
                                        {% for dept in departments %}
                                        <option value="{{ dept.department_id }}">{{ dept.department_name }} ({{ dept.department_code }})</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Academic Year</label>
                                    <select name="academic_year" class="form-control">
                                        <option value="1">1st Year - Freshman</option>
                                        <option value="2">2nd Year - Sophomore</option>
                                        <option value="3">3rd Year - Junior</option>
                                        <option value="4">4th Year - Senior</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Teacher Fields -->
                    <div id="teacher-fields" style="display: none;">
                        <div class="card mb-3">
                            <div class="card-header bg-light">
                                <h6 class="mb-0">Teacher Information</h6>
                            </div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label class="form-label">Employee Number</label>
                                    <input type="text" name="employee_number" class="form-control" placeholder="Will be auto-generated if left blank">
                                    <small class="text-muted">Leave blank to auto-generate (e.g., EMP2024001)</small>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Department</label>
                                    <select name="department_id" class="form-control">
                                        <option value="">Select Department</option>
                                        {% for dept in departments %}
                                        <option value="{{ dept.department_id }}">{{ dept.department_name }} ({{ dept.department_code }})</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Title</label>
                                    <select name="title" class="form-control">
                                        <option value="Instructor">Instructor</option>
                                        <option value="Assistant Professor">Assistant Professor</option>
                                        <option value="Associate Professor">Associate Professor</option>
                                        <option value="Professor">Professor</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
                <hr>
                <p class="text-center mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('role').addEventListener('change', function() {
    const studentFields = document.getElementById('student-fields');
    const teacherFields = document.getElementById('teacher-fields');
    
    if (this.value === 'student') {
        studentFields.style.display = 'block';
        teacherFields.style.display = 'none';
    } else if (this.value === 'teacher') {
        studentFields.style.display = 'none';
        teacherFields.style.display = 'block';
    } else {
        studentFields.style.display = 'none';
        teacherFields.style.display = 'none';
    }
});
</script>
{% endblock %}
